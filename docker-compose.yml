version: '3.8'

services:
  db:
    image: postgres:16
    container_name: samlego-db
    environment:
      POSTGRES_DB: samlego
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d samlego"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: samlego-backend
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/samlego
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: password
      GOOGLE_CLIENT_ID: 311664896204-ba5bigcf606thqcurl508ct91qmfbtbg.apps.googleusercontent.com
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: samlego-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
